version: 2

updates:
  # Keep npm dependencies up to date
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      # Batch all dev-tool bumps into one PR
      dev-tools:
        patterns:
          - "typescript"
          - "tsup"
          - "tsx"
          - "vitest"
          - "@types/*"
    ignore:
      # canvas is pinned intentionally; bumps need manual ABI verification
      - dependency-name: "canvas"
        update-types: ["version-update:semver-major"]

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
