name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code snippet or steps to reproduce
      render: typescript
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Parsing mode
      options:
        - auto
        - fast
        - cost_effective
        - agentic
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: LLM provider
      options:
        - OpenAI
        - Anthropic
        - Ollama
        - Groq
        - Other
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model name
      placeholder: e.g. gpt-4o-mini
  - type: input
    id: version
    attributes:
      label: "@openparse/core version"
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. 20.11.0
    validations:
      required: true
